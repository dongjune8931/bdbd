version: "3.9"

services:
  # ────────────────────────────────────────
  # Infrastructure
  # ────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: bodybuddy-postgres
    environment:
      POSTGRES_USER: bodybuddy
      POSTGRES_PASSWORD: bodybuddy
      POSTGRES_DB: bodybuddy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bodybuddy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bodybuddy-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  localstack:
    image: localstack/localstack:3
    container_name: bodybuddy-localstack
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3,sqs,ses
      - DEFAULT_REGION=ap-northeast-2
      - LOCALSTACK_AUTH_TOKEN=${LOCALSTACK_AUTH_TOKEN:-}
    volumes:
      - localstack_data:/var/lib/localstack
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ────────────────────────────────────────
  # Application Services
  # ────────────────────────────────────────
  user-service:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.user-service
    container_name: bodybuddy-user-service
    ports:
      - "8080:8080"
    environment:
      SERVICE_NAME: user-service
      HTTP_PORT: "8080"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: bodybuddy
      DB_PASSWORD: bodybuddy
      DB_NAME: bodybuddy
      REDIS_ADDR: redis:6379
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: ap-northeast-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      ANALYSIS_QUEUE_URL: http://localstack:4566/000000000000/analysis-queue
      NOTIFICATION_QUEUE_URL: http://localstack:4566/000000000000/notification-queue
      S3_ENDPOINT: http://localstack:4566
      S3_BUCKET: bodybuddy-inbody
      JWT_SECRET: local-dev-secret-change-in-prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: unless-stopped

  score-service:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.score-service
    container_name: bodybuddy-score-service
    ports:
      - "8081:8081"
    environment:
      SERVICE_NAME: score-service
      HTTP_PORT: "8081"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: bodybuddy
      DB_PASSWORD: bodybuddy
      DB_NAME: bodybuddy
      REDIS_ADDR: redis:6379
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: ap-northeast-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      ANALYSIS_QUEUE_URL: http://localstack:4566/000000000000/analysis-queue
      NOTIFICATION_QUEUE_URL: http://localstack:4566/000000000000/notification-queue
      S3_ENDPOINT: http://localstack:4566
      S3_BUCKET: bodybuddy-inbody
      JWT_SECRET: local-dev-secret-change-in-prod
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  analysis-worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.analysis-worker
    container_name: bodybuddy-analysis-worker
    ports:
      - "9090:9090"
    environment:
      SERVICE_NAME: analysis-worker
      METRICS_PORT: "9090"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: bodybuddy
      DB_PASSWORD: bodybuddy
      DB_NAME: bodybuddy
      REDIS_ADDR: redis:6379
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: ap-northeast-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      ANALYSIS_QUEUE_URL: http://localstack:4566/000000000000/analysis-queue
      NOTIFICATION_QUEUE_URL: http://localstack:4566/000000000000/notification-queue
      SQS_VISIBILITY_TIMEOUT: "90"
      SQS_MAX_MESSAGES: "10"
      SQS_WAIT_TIME_SECONDS: "20"
      S3_ENDPOINT: http://localstack:4566
      S3_BUCKET: bodybuddy-inbody
      JWT_SECRET: local-dev-secret-change-in-prod
      SCORE_SERVICE_URL: http://score-service:8081
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
      score-service:
        condition: service_started
    restart: unless-stopped

  notification-worker:
    build:
      context: .
      dockerfile: deploy/docker/Dockerfile.notification-worker
    container_name: bodybuddy-notification-worker
    ports:
      - "9091:9091"
    environment:
      SERVICE_NAME: notification-worker
      METRICS_PORT: "9091"
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: bodybuddy
      DB_PASSWORD: bodybuddy
      DB_NAME: bodybuddy
      REDIS_ADDR: redis:6379
      SQS_ENDPOINT: http://localstack:4566
      AWS_REGION: ap-northeast-2
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      ANALYSIS_QUEUE_URL: http://localstack:4566/000000000000/analysis-queue
      NOTIFICATION_QUEUE_URL: http://localstack:4566/000000000000/notification-queue
      S3_ENDPOINT: http://localstack:4566
      S3_BUCKET: bodybuddy-inbody
      JWT_SECRET: local-dev-secret-change-in-prod
      SES_ENDPOINT: http://localstack:4566
      FROM_EMAIL: noreply@bodybuddy.local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      localstack:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  localstack_data:
