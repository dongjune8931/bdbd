replicaCount: 1

image:
  repository: 902371998304.dkr.ecr.ap-northeast-2.amazonaws.com/bodybuddy-dev-user-service
  tag: 011d1c1
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::902371998304:role/bodybuddy-dev-user-service-irsa"

podAnnotations: {}

podLabels: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s

ingress:
  enabled: true
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/security-groups: bodybuddy-dev-user-service-alb
  hosts:
    - host: ""
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: true
  minAvailable: 1

config:
  serviceName: user-service
  logLevel: info
  awsRegion: ap-northeast-2
  dbHost: bodybuddy-dev-postgres.chqo0a0kqjjr.ap-northeast-2.rds.amazonaws.com
  dbPort: 5432
  dbName: bodybuddy
  dbSslMode: require
  redisAddr: master.bodybuddy-dev-redis.ebyc4l.apn2.cache.amazonaws.com:6379
  redisTlsEnabled: true
  analysisQueueUrl: https://sqs.ap-northeast-2.amazonaws.com/902371998304/bodybuddy-dev-analysis-queue
  notificationQueueUrl: https://sqs.ap-northeast-2.amazonaws.com/902371998304/bodybuddy-dev-notification-queue
  s3Bucket: bodybuddy-dev-inbody
  otelEndpoint: "otel-collector-opentelemetry-collector.bodybuddy-system:4317"

secrets:
  dbUser: bodybuddy
  dbPassword: 'zS(-haBep3ihk.nchUjV5n4N7qC['
  redisPassword: ""
  jwtSecret: "bodybuddy-dev-jwt-secret-2026-user-service"

nodeSelector:
  workload-type: critical

tolerations: []

affinity: {}
