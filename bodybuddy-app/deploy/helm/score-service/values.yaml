replicaCount: 4

image:
  repository: 902371998304.dkr.ecr.ap-northeast-2.amazonaws.com/bodybuddy-dev-score-service
  tag: manual-20260613-002
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::902371998304:role/bodybuddy-dev-score-service-irsa"

podAnnotations: {}

podLabels: {}

service:
  type: ClusterIP
  port: 80
  targetPort: 8081

serviceMonitor:
  enabled: true
  interval: 30s
  scrapeTimeout: 10s

ingress:
  enabled: false
  className: alb
  annotations: {}
  hosts: []

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 50

rollout:
  enabled: true
  revisionHistoryLimit: 2
  canary:
    maxSurge: 1
    maxUnavailable: 0
    steps:
      - setWeight: 25
      - pause:
          duration: 30s
      - analysis:
          templates:
            - templateName: score-service-release-check
      - setWeight: 50
      - pause:
          duration: 30s
      - analysis:
          templates:
            - templateName: score-service-release-check
      - setWeight: 100
  analysis:
    interval: 30s
    count: 2
    failureLimit: 1
    successConditionErrorRate: result[0] <= 0.01
    successConditionP95: result[0] <= 0.30
    prometheusAddress: http://observability-kube-prometh-prometheus.bodybuddy-system:9090
    rankingPath: /api/v1/ranking

pdb:
  enabled: true
  minAvailable: 1

config:
  serviceName: score-service
  logLevel: info
  awsRegion: ap-northeast-2
  dbHost: bodybuddy-dev-postgres.chqo0a0kqjjr.ap-northeast-2.rds.amazonaws.com
  dbPort: 5432
  dbName: bodybuddy
  dbSslMode: require
  redisAddr: master.bodybuddy-dev-redis.ebyc4l.apn2.cache.amazonaws.com:6379
  redisTlsEnabled: true
  analysisQueueUrl: https://sqs.ap-northeast-2.amazonaws.com/902371998304/bodybuddy-dev-analysis-queue
  notificationQueueUrl: https://sqs.ap-northeast-2.amazonaws.com/902371998304/bodybuddy-dev-notification-queue
  s3Bucket: bodybuddy-dev-inbody
  otelEndpoint: "otel-collector-opentelemetry-collector.bodybuddy-system:4317"

secrets:
  dbUser: bodybuddy
  dbPassword: 'xz).SMmr3AfykMGSuPUrnNZupJPu'
  redisPassword: ""
  jwtSecret: "bodybuddy-dev-jwt-secret-2026-user-service"

nodeSelector:
  workload-type: critical

tolerations: []

affinity: {}
