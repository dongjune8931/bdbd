apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "notification-worker.fullname" . }}
  labels:
    {{- include "notification-worker.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "notification-worker.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "notification-worker.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "notification-worker.serviceAccountName" . }}
      terminationGracePeriodSeconds: 120
      containers:
        - name: notification-worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: metrics
              containerPort: 9091
              protocol: TCP
          env:
            - name: SERVICE_NAME
              value: {{ .Values.config.serviceName | quote }}
            - name: LOG_LEVEL
              value: {{ .Values.config.logLevel | quote }}
            - name: DB_HOST
              value: {{ .Values.config.dbHost | quote }}
            - name: DB_PORT
              value: {{ .Values.config.dbPort | quote }}
            - name: DB_NAME
              value: {{ .Values.config.dbName | quote }}
            - name: DB_SSL_MODE
              value: {{ .Values.config.dbSslMode | quote }}
            - name: REDIS_ADDR
              value: {{ .Values.config.redisAddr | quote }}
            - name: REDIS_TLS_ENABLED
              value: {{ .Values.config.redisTlsEnabled | quote }}
            - name: AWS_REGION
              value: {{ .Values.config.awsRegion | quote }}
            - name: ANALYSIS_QUEUE_URL
              value: {{ .Values.config.analysisQueueUrl | quote }}
            - name: NOTIFICATION_QUEUE_URL
              value: {{ .Values.config.notificationQueueUrl | quote }}
            - name: S3_BUCKET
              value: {{ .Values.config.s3Bucket | quote }}
            - name: METRICS_PORT
              value: {{ .Values.config.metricsPort | quote }}
            - name: SES_REGION
              value: {{ .Values.config.sesRegion | quote }}
            - name: SES_ENDPOINT
              value: {{ .Values.config.sesEndpoint | quote }}
            - name: FROM_EMAIL
              value: {{ .Values.config.fromEmail | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "notification-worker.fullname" . }}
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "notification-worker.fullname" . }}
                  key: DB_PASSWORD
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "notification-worker.fullname" . }}
                  key: REDIS_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "notification-worker.fullname" . }}
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /readyz
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: metrics
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
