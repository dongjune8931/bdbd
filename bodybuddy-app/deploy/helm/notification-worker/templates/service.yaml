apiVersion: v1
kind: Service
metadata:
  name: {{ include "notification-worker.fullname" . }}
  labels:
    {{- include "notification-worker.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "notification-worker.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
      protocol: TCP
