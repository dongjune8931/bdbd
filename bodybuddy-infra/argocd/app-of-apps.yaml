apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bodybuddy-app-of-apps
  namespace: bodybuddy-system
  labels:
    app.kubernetes.io/part-of: bodybuddy
spec:
  project: bodybuddy
  source:
    repoURL: https://github.com/dongjune8931/bdbd.git
    targetRevision: main
    path: bodybuddy-infra/argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: bodybuddy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
