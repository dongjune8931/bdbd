apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  role: bodybuddy-dev-eks-karpenter-node
  subnetSelectorTerms:
    - id: subnet-009e7c2248b36cd74
    - id: subnet-031c3d0b18f983ffe
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: bodybuddy-dev-eks
  tags:
    Project: bodybuddy
    Environment: dev
    ManagedBy: argocd
    karpenter.sh/discovery: bodybuddy-dev-eks
