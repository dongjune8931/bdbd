apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  role: bodybuddy-dev-eks-karpenter-node
  subnetSelectorTerms:
    - id: subnet-0bf856bcb7ed4354e
    - id: subnet-08e858bb23c183a39
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: bodybuddy-dev-eks
  tags:
    Project: bodybuddy
    Environment: dev
    ManagedBy: argocd
    karpenter.sh/discovery: bodybuddy-dev-eks
