apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: default
spec:
  amiFamily: AL2023
  amiSelectorTerms:
    - alias: al2023@latest
  role: bodybuddy-dev-eks-karpenter-node
  subnetSelectorTerms:
    - id: subnet-098bb41208e1d082f
    - id: subnet-085ff253cf8de3dae
  securityGroupSelectorTerms:
    - tags:
        karpenter.sh/discovery: bodybuddy-dev-eks
  tags:
    Environment: dev
    ManagedBy: argocd
    Project: bodybuddy
    karpenter.sh/discovery: bodybuddy-dev-eks
