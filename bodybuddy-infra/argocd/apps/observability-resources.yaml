apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-resources
  namespace: bodybuddy-system
  labels:
    app.kubernetes.io/part-of: bodybuddy
    app.kubernetes.io/component: observability
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: bodybuddy
  source:
    repoURL: https://github.com/dongjune8931/bdbd.git
    targetRevision: main
    path: bodybuddy-infra/argocd/observability-resources
  destination:
    server: https://kubernetes.default.svc
    namespace: bodybuddy-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
