apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: bodybuddy-alerts
  namespace: bodybuddy
  labels:
    app.kubernetes.io/part-of: bodybuddy
    release: observability
spec:
  groups:
    - name: bodybuddy.pods
      interval: 1m
      rules:
        # Pod restart alert - proxy for application errors
        - alert: BodyBuddyPodCrashLooping
          expr: |
            increase(kube_pod_container_status_restarts_total{namespace="bodybuddy"}[15m]) > 3
          for: 5m
          labels:
            severity: critical
            team: bodybuddy
          annotations:
            summary: "Pod {{ $labels.pod }} is crash looping"
            description: "Pod {{ $labels.pod }} (container {{ $labels.container }}) has restarted {{ $value | printf \"%.0f\" }} times in the last 15 minutes."

        # Pod not running
        - alert: BodyBuddyPodNotRunning
          expr: |
            kube_pod_status_phase{namespace="bodybuddy", phase=~"Failed|Unknown"} > 0
          for: 5m
          labels:
            severity: critical
            team: bodybuddy
          annotations:
            summary: "Pod {{ $labels.pod }} is not running"
            description: "Pod {{ $labels.pod }} is in {{ $labels.phase }} state."

        # High memory usage
        - alert: BodyBuddyHighMemoryUsage
          expr: |
            container_memory_working_set_bytes{namespace="bodybuddy", container!="", container!="POD"}
            / on(namespace, pod, container)
            kube_pod_container_resource_limits{namespace="bodybuddy", resource="memory"}
            > 0.85
          for: 10m
          labels:
            severity: warning
            team: bodybuddy
          annotations:
            summary: "High memory usage in {{ $labels.container }}"
            description: "Container {{ $labels.container }} in pod {{ $labels.pod }} is using {{ $value | humanizePercentage }} of its memory limit."

    - name: bodybuddy.infrastructure
      interval: 1m
      rules:
        # RDS connection pool (approximated via CloudWatch - placeholder for when CW exporter is added)
        # For now alert on Go goroutine count as proxy for concurrent requests
        - alert: BodyBuddyHighGoroutineCount
          expr: |
            go_goroutines{namespace="bodybuddy"} > 500
          for: 5m
          labels:
            severity: warning
            team: bodybuddy
          annotations:
            summary: "High goroutine count in {{ $labels.job }}"
            description: "Service {{ $labels.job }} has {{ $value }} goroutines. Possible connection leak or traffic spike."

        # Service down (not scraping)
        - alert: BodyBuddyServiceDown
          expr: |
            up{namespace="bodybuddy"} == 0
          for: 2m
          labels:
            severity: critical
            team: bodybuddy
          annotations:
            summary: "Service {{ $labels.job }} is down"
            description: "Prometheus cannot scrape {{ $labels.job }} at {{ $labels.instance }}."

    - name: bodybuddy.workers
      interval: 1m
      rules:
        # Worker pod not ready - SQS messages may be backing up
        - alert: BodyBuddyWorkerNotReady
          expr: |
            kube_deployment_status_replicas_ready{namespace="bodybuddy", deployment=~"analysis-worker|notification-worker"}
            < kube_deployment_spec_replicas{namespace="bodybuddy", deployment=~"analysis-worker|notification-worker"}
          for: 5m
          labels:
            severity: warning
            team: bodybuddy
          annotations:
            summary: "Worker {{ $labels.deployment }} has unavailable replicas"
            description: "{{ $labels.deployment }} has {{ $value }} ready replicas, expected more. SQS messages may be accumulating."
