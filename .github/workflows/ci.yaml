name: ci

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bodybuddy-app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: bodybuddy-app/go.mod
          cache-dependency-path: bodybuddy-app/go.sum

      - name: Download modules
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Validate OCR runtime syntax
        run: python3 -m py_compile inference-runtime/app.py inference-runtime/download_models.py

  docker:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: user-service
            dockerfile: bodybuddy-app/deploy/docker/Dockerfile.user-service
          - service: score-service
            dockerfile: bodybuddy-app/deploy/docker/Dockerfile.score-service
          - service: analysis-worker
            dockerfile: bodybuddy-app/deploy/docker/Dockerfile.analysis-worker
          - service: inference-service
            dockerfile: bodybuddy-app/deploy/docker/Dockerfile.inference-service
          - service: ocr-runtime
            dockerfile: bodybuddy-app/inference-runtime/Dockerfile.gpu
          - service: notification-worker
            dockerfile: bodybuddy-app/deploy/docker/Dockerfile.notification-worker

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}

      - name: Login to Amazon ECR
        id: login-ecr
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Compute image tags
        id: meta
        shell: bash
        run: |
          short_sha="${GITHUB_SHA::7}"
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
            registry="${{ steps.login-ecr.outputs.registry }}"
            repository="bodybuddy-dev-${{ matrix.service }}"
            echo "image=${registry}/${repository}" >> "$GITHUB_OUTPUT"
            echo "tags=${registry}/${repository}:${short_sha},${registry}/${repository}:latest" >> "$GITHUB_OUTPUT"
          else
            echo "image=bodybuddy/${{ matrix.service }}" >> "$GITHUB_OUTPUT"
            echo "tags=bodybuddy/${{ matrix.service }}:${short_sha}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./bodybuddy-app
          file: ./${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
